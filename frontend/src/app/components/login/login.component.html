<div class="fixed" style="top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px;" (click)="onClose()">
  <div class="card bg-primary" style="max-width: 450px; width: 100%; max-height: 90vh; overflow-y: auto;" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between mb-lg">
      <h2 class="text-2xl font-bold text-dark">Welcome Back</h2>
      <button (click)="onClose()" class="text-2xl cursor-pointer" style="background: none; border: none;">&times;</button>
    </div>
    
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input 
          type="text" 
          class="form-input" 
          placeholder="Enter your username"
          [(ngModel)]="loginData.username"
          name="username"
          required>
      </div>
      
      <div class="form-group">
        <label class="form-label">Password</label>
        <input 
          type="password" 
          class="form-input" 
          placeholder="Enter your password"
          [(ngModel)]="loginData.password"
          name="password"
          required>
      </div>
      
      <div class="flex items-center justify-between mb-lg">
        <label class="flex items-center gap-xs cursor-pointer">
          <input 
            type="checkbox"
            [(ngModel)]="loginData.rememberMe"
            name="rememberMe">
          <span class="text-sm text-secondary">Remember me</span>
        </label>
        <a class="text-sm text-muted cursor-pointer">Forgot Password?</a>
      </div>
      
      <button type="submit" class="btn btn-primary btn-block mb-md" [disabled]="isLoading()">
        @if (isLoading()) {
          <span>Signing in...</span>
        } @else {
          <span>Sign In</span>
        }
      </button>
      
      <div class="text-center text-secondary">
        Don't have an account? 
        <a (click)="onSwitchToRegister()" class="text-dark cursor-pointer font-medium">Sign Up</a>
      </div>
    </form>
  </div>
</div>
