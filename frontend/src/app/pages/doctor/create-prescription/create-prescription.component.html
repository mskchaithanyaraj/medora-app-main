<div class="create-prescription-page">
  <div class="page-header">
    <a routerLink="/doctor/appointments" class="back-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back to Appointments
    </a>
    <h2 class="page-title">Create Prescription</h2>
  </div>

  <div class="prescription-container">
    <!-- Appointment Info Card -->
    <div class="appointment-info-card">
      <h3>Appointment Details</h3>
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">Patient</span>
          <span class="info-value">{{ appointment().patientName }}</span>
        </div>
        <div class="info-item">
          <span class="info-label">Date</span>
          <span class="info-value">{{ formatDate(appointment().date) }}</span>
        </div>
        <div class="info-item full-width">
          <span class="info-label">Reason for Visit</span>
          <span class="info-value">{{ appointment().reason }}</span>
        </div>
      </div>
    </div>

    <!-- Prescription Form -->
    <form (ngSubmit)="onSubmit()" class="prescription-form">
      <div class="form-section">
        <h3 class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          Diagnosis
        </h3>
        <div class="form-group">
          <textarea 
            class="form-input"
            [(ngModel)]="prescriptionData.diagnosis"
            name="diagnosis"
            rows="3"
            placeholder="Enter your diagnosis based on examination and symptoms..."></textarea>
        </div>
      </div>

      <div class="form-section">
        <h3 class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="9" x2="15" y2="9"></line>
            <line x1="9" y1="13" x2="15" y2="13"></line>
            <line x1="9" y1="17" x2="13" y2="17"></line>
          </svg>
          Prescribed Medicine
        </h3>
        <div class="form-group">
          <textarea 
            class="form-input"
            [(ngModel)]="prescriptionData.medicine"
            name="medicine"
            rows="6"
            placeholder="Enter prescribed medicines with dosage instructions...
Example:
1. Paracetamol 500mg - Take 1 tablet every 6 hours
2. Vitamin C - Once daily after meals
3. Rest and hydration"></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-outline" routerLink="/doctor/appointments">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="isLoading()">
          @if (isLoading()) {
            Creating...
          } @else {
            Create Prescription
          }
        </button>
      </div>
    </form>
  </div>
</div>
